name: FinderColours

options:
  bundleIdPrefix: ca.macvfx
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic

targets:
  FinderColours:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Finder Colours
        CFBundleName: Finder Colours
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: Copyright © 2026 Mat X
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.macvfx.FinderColours
        PRODUCT_NAME: Finder Colours
        PRODUCT_MODULE_NAME: FinderColours
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FinderColoursTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: FinderColours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.macvfx.FinderColoursTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finder Colours.app/Contents/MacOS/Finder Colours"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FinderColours:
    build:
      targets:
        FinderColours: all
        FinderColoursTests: [test]
    test:
      targets:
        - FinderColoursTests
